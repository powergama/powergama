name: Create Release

on:
  push:
    # Run when a tag matches v*, e.g. v0.1.0, v1.30.0
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  autorelease:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.5.1

      - name: Check Poetry version
        run: poetry --version

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Add project version to environment
        run: |
          PROJECT_VERSION=$(poetry version --short)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> "$GITHUB_ENV"

      - name: Check tag version matches project version
        run: |
          TAG="${GITHUB_REF_NAME}"

          echo "Tag: $TAG"
          echo "Project version: $PROJECT_VERSION"

          if [[ "$TAG" != "v$PROJECT_VERSION" ]]; then
            echo "Tag version does not match project version."
            exit 1
          fi

      - name: Check pyproject.toml validity
        run: poetry check

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Setup GLPK
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils

      - name: Run tests
        run: poetry run pytest -v

      - name: Build
        run: poetry build

      - name: Generate release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)

          if [[ -n "$PREVIOUS_TAG" ]]; then
            git log "$PREVIOUS_TAG..$GITHUB_SHA" \
              --pretty='format:* %h %s%n  * %an <%ae>' \
              --no-merges \
              > .github/release_template.md
          else
            git log "$GITHUB_SHA" \
              --pretty='format:* %h %s%n  * %an <%ae>' \
              --no-merges \
              > .github/release_template.md
          fi

      - name: Create Release Draft
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release_template.md
          draft: true
          files: |
            dist/random_standup-${{ env.PROJECT_VERSION }}-py3-none-any.whl
            dist/random-standup-${{ env.PROJECT_VERSION }}.tar.gz