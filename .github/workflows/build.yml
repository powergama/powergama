name: CI Build

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.14"
    env:
      last_python_version: "3.14"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==2.5.1

      - name: Check Poetry version
        run: poetry --version

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Check pyproject.toml validity
        run: poetry check

      - name: Setup GLPK on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y glpk-utils

      - name: Setup GLPK on macOS
        if: matrix.os == 'macos-latest'
        run: brew install glpk

      - name: Setup GLPK on Windows
        if: matrix.os == 'windows-latest'
        run: choco install glpk -y

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest -v

      - name: Run notebook tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.last_python_version
        run: poetry run pytest -v --nbmake -k ipynb

      - name: Create coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.last_python_version
        run: |
          poetry run coverage run -m pytest
          poetry run coverage xml

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.last_python_version
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build artifacts
        run: poetry build
