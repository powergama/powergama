[project]
name = "powergama"
version = "2.1.0"
description = "PowerGAMA - Power Grid And Market Analysis tool"
authors = [
    {name = "PowerGAMA Developers"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.15"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=2.3",
    "pandas>=2.3",
    "pyomo>=6.9",
    "scipy>=1.16",
    "matplotlib>=3.10",
    "branca>=0.8",
    "folium>=0.20",
    "cloudpickle>=3.1",
    "networkx>=3.5",
    "geopandas>=1.1",
    "highspy>=1.12",
    "tqdm>=4.67",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
    "mypy>=1.18",
    "nbmake>=1.5",
    "bandit>=1.8.6",
    "pre-commit>=4.3",
    "coverage>=7.11",
]

[project.urls]
Homepage = "https://github.com/powergama/powergama"


[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
markers = [
    "slow: long-running integration test; skip locally with -m 'not slow'",
]

[tool.bandit]
exclude_dirs = ["tests", "__pycache__", ".pytest_cache"]

[tool.coverage.run]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"